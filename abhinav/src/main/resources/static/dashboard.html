<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MyDrive — Dashboard</title>
    <link rel="stylesheet" href="/style.css"/>
</head>
<body>

<header>
    <h1>🗄️ MyDrive</h1>
    <div class="header-right">
        <span id="username-display"></span>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</header>

<main>
    <section class="upload-section">
        <div class="drop-zone" id="dropZone">
            <p>📂 Drag & Drop files here</p>
            <p>or</p>
            <label class="btn-primary">
                Browse Files
                <input type="file" id="fileInput" multiple hidden
                       accept=".jpg,.jpeg,.png,.pdf,.mp4,.mov,.avi,.mkv,.webm"/>
            </label>
        </div>
        <div id="uploadStatus"></div>
    </section>

    <section class="files-section">
        <h2>Your Files</h2>
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="🔍 Search files..." oninput="filterFiles()"/>
        </div>
        <div id="fileGrid" class="file-grid">
            <p>Loading...</p>
        </div>
    </section>
</main>

<!-- Preview Modal -->
<div id="previewModal" class="modal-overlay" onclick="closePreview(event)">
    <div class="modal-box">
        <div class="modal-header">
            <span id="previewTitle" class="modal-title"></span>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="previewBody"></div>
        <div class="modal-footer">
            <button class="btn-download-modal" id="modalDownloadBtn">⬇ Download</button>
        </div>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
